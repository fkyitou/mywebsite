<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canvas under a CSS mask</title>
<!--
  آینده‌نگار · a diagnostic page, not part of the template.
  On 2026-11-05 Firecrawl's browser (Chrome 156, no GPU) painted the article banner and the home globe of the live blog
  as flat white, while the article cards, whose canvases have no CSS mask, were drawn. This page puts the same kinds of
  layers side by side on a grey page, so one screenshot shows which ones a browser paints:
  correct = navy with an orange disc, transparent = grey, broken = white.
-->
<style>
  body { margin: 0; padding: 12px; background: #808080; font: 14px/1.4 system-ui, sans-serif; color: #000; }
  .row { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  figure { margin: 0; }
  figcaption { font-size: 12px; margin-top: 4px; }
  .box { position: relative; height: 140px; overflow: hidden; }
  .box canvas, .box img { display: block; width: 100%; height: 100%; }
  .mask { -webkit-mask-image: linear-gradient(180deg, #000 calc(100% - 40px), transparent); mask-image: linear-gradient(180deg, #000 calc(100% - 40px), transparent); }
  .grad { width: 100%; height: 100%; background: linear-gradient(135deg, #0B1530, #1D2B55); }
  /* the article banner's own structure: isolated section, art at z-index -2, shade at -1, both masked */
  .ban { position: relative; isolation: isolate; height: 140px; overflow: hidden; display: grid; align-items: end; color: #fff; }
  .ban .art { position: absolute; inset: 0; z-index: -2; }
  .ban .art canvas { display: block; width: 100%; height: 100%; }
  .ban::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(0deg, #04060D 0%, rgba(4, 6, 13, .78) 32%, rgba(4, 6, 13, .15) 70%, rgba(4, 6, 13, .35) 100%); }
  .ban .art, .ban::after { -webkit-mask-image: linear-gradient(180deg, #000 calc(100% - 40px), transparent); mask-image: linear-gradient(180deg, #000 calc(100% - 40px), transparent); }
  .ban.nomask .art { -webkit-mask-image: none; mask-image: none; }
  .ban p { margin: 0 8px 44px; font-weight: 700; }
</style>
</head>
<body>
<p id="ua"></p>
<div class="row">
  <figure><div class="box"><canvas data-k="2d"></canvas></div><figcaption>1. canvas, no mask</figcaption></figure>
  <figure><div class="box mask"><canvas data-k="2d"></canvas></div><figcaption>2. canvas in a masked div</figcaption></figure>
  <figure><div class="box"><canvas class="mask" data-k="2d"></canvas></div><figcaption>3. mask on the canvas</figcaption></figure>
  <figure><div class="box"><canvas data-k="2d" data-fade="1"></canvas></div><figcaption>4. no mask, fade drawn in the canvas</figcaption></figure>
  <figure><div class="box mask"><div class="grad"></div></div><figcaption>5. CSS gradient in a masked div</figcaption></figure>
  <figure><div class="box mask"><img alt="canvas copy" data-k="img"></div><figcaption>6. image of a canvas in a masked div</figcaption></figure>
  <figure><div class="box mask"><canvas data-k="gl"></canvas></div><figcaption>7. WebGL canvas in a masked div</figcaption></figure>
  <figure><div class="box"><canvas data-k="gl"></canvas></div><figcaption>8. WebGL canvas, no mask</figcaption></figure>
  <figure><section class="ban"><div class="art"><canvas data-k="2d"></canvas></div><p>Banner title</p></section><figcaption>9. article banner as built</figcaption></figure>
  <figure><section class="ban nomask"><div class="art"><canvas data-k="2d" data-fade="1"></canvas></div><p>Banner title</p></section><figcaption>10. banner, art fade drawn in the canvas</figcaption></figure>
</div>
<script>
(function () {
  document.getElementById('ua').textContent = navigator.userAgent;
  function paint(c, fade) {
    var r = c.getBoundingClientRect(), k = Math.min(window.devicePixelRatio || 1, 2), w = Math.round(r.width * k), h = Math.round(r.height * k);
    c.width = w; c.height = h;
    var x = c.getContext('2d'); if (!x) return false;
    var g = x.createLinearGradient(0, 0, w, h); g.addColorStop(0, '#0B1530'); g.addColorStop(1, '#02040A'); x.fillStyle = g; x.fillRect(0, 0, w, h);
    x.fillStyle = '#FF8A4C'; x.beginPath(); x.arc(w * 0.5, h * 0.45, Math.min(w, h) * 0.22, 0, Math.PI * 2); x.fill();
    if (fade) {
      var f = Math.min(h, 40 * k), fg = x.createLinearGradient(0, h - f, 0, h);
      fg.addColorStop(0, 'rgba(0,0,0,0)'); fg.addColorStop(1, 'rgba(0,0,0,1)');
      x.globalCompositeOperation = 'destination-out'; x.fillStyle = fg; x.fillRect(0, h - f, w, f); x.globalCompositeOperation = 'source-over';
    }
    return true;
  }
  var src = document.createElement('canvas');
  [].forEach.call(document.querySelectorAll('[data-k]'), function (e) {
    var k = e.getAttribute('data-k');
    if (k === '2d') paint(e, e.hasAttribute('data-fade'));
    else if (k === 'img') { src.style.width = '150px'; src.style.height = '140px'; document.body.appendChild(src); paint(src); e.src = src.toDataURL(); src.remove(); }
    else if (k === 'gl') {
      var gl = e.getContext('webgl'); if (!gl) { e.parentNode.parentNode.querySelector('figcaption').textContent += ' (no WebGL)'; return; }
      gl.clearColor(0.043, 0.082, 0.188, 1); gl.clear(gl.COLOR_BUFFER_BIT);
    }
  });
})();
</script>
</body>
</html>
